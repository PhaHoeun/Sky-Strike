      <div class="hud-card p-2 rounded-sm chamfer-clip flex flex-col justify-between">
        <div class="font-label-sm text-[8px] text-outline uppercase tracking-wider">ARMOR</div>

        <div class="text-right font-body-sm text-[11px] text-primary-container font-bold mt-0.5" id="next-armor">→ 82</div>

      <div class="hud-card p-2 rounded-sm chamfer-clip flex flex-col justify-between">

        <div class="flex items-baseline gap-1 mt-1">
          <span class="font-headline-md text-[18px] font-bold text-on-surface leading-none" id="stat-fire">88</span>
          <span class="font-label-sm text-[10px] font-bold text-[#00E676] bg-[#00E676]/15 px-1 rounded-xs" id="delta-fire">+3</span>

  <!-- 4. Bottom Upgrade Action Card & Navigation Dock -->

<script>
  const modules = {
    engine: { title: 'VECTOR THRUST ENGINE MK-V → MK-VI', cost: '2,400', speed: '+6', armor: '+4', fire: '+3' },
    shield: { title: 'PLASMA DEFLECTOR SHIELD MK-IV → MK-V', cost: '1,850', speed: '+1', armor: '+9', fire: '+1' },
    cannon: { title: '20MM WING ROTARY CANNON MK-IV → MK-V', cost: '1,600', speed: '+2', armor: '+1', fire: '+7' },
    missiles: { title: 'AMRAAM SMART BAY MK-V → MK-VI', cost: '2,800', speed: '+1', armor: '+2', fire: '+9' }
  };

  let baseStats = { speed: 92, armor: 78, fire: 88 };
  let activeKey = 'engine';

  function renderDeltas() {
    const m = modules[activeKey];
    const ds = parseInt(m.speed, 10), da = parseInt(m.armor, 10), df = parseInt(m.fire, 10);
    document.getElementById('focus-title').textContent = m.title;
    document.getElementById('cost-badge').textContent = m.cost;
    document.getElementById('stat-speed').textContent = baseStats.speed;
    document.getElementById('delta-speed').textContent = m.speed;
    document.getElementById('next-speed').textContent = '→ ' + (baseStats.speed + ds);
    document.getElementById('stat-armor').textContent = baseStats.armor;
    document.getElementById('delta-armor').textContent = m.armor;
    document.getElementById('next-armor').textContent = '→ ' + (baseStats.armor + da);
    document.getElementById('stat-fire').textContent = baseStats.fire;
    document.getElementById('delta-fire').textContent = m.fire;
    document.getElementById('next-fire').textContent = '→ ' + (baseStats.fire + df);
  }

  document.querySelectorAll('.node-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeKey = btn.dataset.node;
      document.querySelectorAll('.node-btn').forEach(b => {
        b.classList.remove('border-tertiary-container', 'shadow-[0_0_14px_rgba(34,239,126,0.35)]');
        b.classList.add('hud-card');
      });
      btn.classList.remove('hud-card');
      btn.classList.add('bg-surface-container-high/95', 'border', 'border-tertiary-container', 'shadow-[0_0_14px_rgba(34,239,126,0.35)]');
      renderDeltas();
    });
  });

  document.getElementById('btn-upgrade').addEventListener('click', () => {
    const m = modules[activeKey];
    baseStats.speed += parseInt(m.speed, 10);
    baseStats.armor += parseInt(m.armor, 10);
    baseStats.fire += parseInt(m.fire, 10);
    renderDeltas();
  });
</script>
</body></html>
